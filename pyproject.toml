[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chime-perf"
version = "0.1.0"
description = "Parametric performance model for CHIME (Copernicus Hyperspectral Imaging Mission for the Environment)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "CHIME Project" },
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.urls]
Repository = "https://github.com/esa/chime-performance-sup"
Issues = "https://github.com/esa/chime-performance-sup/issues"
Paper = "https://spie.org/spie-sensors-imaging/presentation/CHIME-system-performance-at-critical-design-review--a-parametric/14279-7"

[tool.setuptools]
packages = ["chime_perf"]
include-package-data = false

[tool.setuptools.package-data]
chime_perf = ["data/*.csv", "data/*.yml", "data/*.txt"]

[tool.ruff]
line-length = 95
target-version = "py310"
# Markdown holds the spec verbatim and illustrative snippets in prose; reformatting
# fenced examples as if they were source produces churn and loses aligned annotations.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::UserWarning"]
